                    const artifactsData = [];
                    snapshot.forEach(doc => {
                        artifactsData.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort by item number
                    artifactsData.sort((a, b) => (a.itemNumber || 0) - (b.itemNumber || 0));
                    setArtifacts(artifactsData);
                    setFilteredArtifacts(artifactsData);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            // Filter & sort artifacts
            useEffect(() => {
                let filtered = artifacts;

                // Filter by site first
                filtered = filtered.filter(a => a.site === selectedSite);

                if (selectedLocation !== 'All') {
                    filtered = filtered.filter(a => a.location?.trim() === selectedLocation);
                }

                if (searchTerm) {
                    filtered = filtered.filter(a => 
                        a.name?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.location?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.description?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.donor?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.itemNumber?.toString().includes(searchTerm)
                    );
                }

                // Sort
                filtered = [...filtered].sort((a, b) => {
                    let aVal, bVal;
                    switch (sortBy) {
                        case 'name':
                            aVal = a.name?.toLowerCase() || '';
                            bVal = b.name?.toLowerCase() || '';
                            break;
                        case 'location':
                            aVal = a.location?.toLowerCase() || '';
                            bVal = b.location?.toLowerCase() || '';
                            break;
                        case 'updatedAt':
                            aVal = a.updatedAt?.toMillis?.() || 0;
                            bVal = b.updatedAt?.toMillis?.() || 0;
                            break;
                        case 'createdAt':
                            aVal = a.createdAt?.toMillis?.() || 0;
                            bVal = b.createdAt?.toMillis?.() || 0;
                            break;
                        case 'condition':
                            const condOrder = { 'Excellent': 0, 'Good': 1, 'Fair': 2, 'Poor': 3 };
                            aVal = condOrder[a.condition] ?? 99;
                            bVal = condOrder[b.condition] ?? 99;
                            break;
                        case 'itemNumber':
                        default:
                            aVal = a.itemNumber || 0;
                            bVal = b.itemNumber || 0;
                    }
                    if (aVal < bVal) return sortDir === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortDir === 'asc' ? 1 : -1;
                    return 0;
                });

                setFilteredArtifacts(filtered);
            }, [searchTerm, selectedLocation, artifacts, selectedSite, sortBy, sortDir]);

            // Compact Numbers - Renumber items sequentially
            const compactNumbers = async () => {
                try {
                    setLoading(true);
                    const sortedArtifacts = [...artifacts].sort((a, b) => (a.itemNumber || 0) - (b.itemNumber || 0));
                    const batch = db.batch();

                            itemNumber: index + 1,

            // Bulk Delete
            const bulkDelete = async () => {

            // Bulk Move Location
            const bulkMoveLocation = async (newLocation) => {

                try {
                    setLoading(true);
                    const batch = db.batch();

                    setShowBulkActions(false);

                } catch (error) {

                    setLoading(false);

            // Migrate existing artifacts to WWII Tunnels site
            const migrateToSite = async () => {
                if (!confirm('This will assign all existing artifacts without a site to "WWII Tunnels". Continue?')) return;
                
                try {
                    setLoading(true);

                    setLoading(false);
                } catch (error) {

                    alert('Error during migration');
                    setLoading(false);
                }
            };

            // Upload photo
            // ── Canvas resize helper ─────────────────────────────────────
            // Draws an image file onto a canvas at maxWidth/maxHeight, returns a Blob
            const resizeImage = (file, maxWidth, maxHeight, quality = 0.82) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(file);
                    img.onload = () => {
                        URL.revokeObjectURL(objectUrl);
                        let { width, height } = img;
                        // Scale down proportionally
                        if (width > maxWidth || height > maxHeight) {
                            const ratio = Math.min(maxWidth / width, maxHeight / height);
                            width  = Math.round(width  * ratio);
                            height = Math.round(height * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width  = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => {
                            if (blob) resolve(blob);
                            else reject(new Error('Canvas toBlob failed'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Image load failed')); };
                    img.src = objectUrl;
                });
            };

            // Upload both a full-res (max 1200px) and a thumbnail (max 400px)
            // Returns { fullUrl, thumbUrl }
            const uploadPhoto = async (file, artifactId) => {
                if (!file) return null;
                try {
                    setUploadingPhoto(true);
                    const timestamp = Date.now();
                    const baseName  = file.name.replace(/\.[^.]+$/, ''); // strip extension
                    const storageRef = storage.ref();

                    // Resize to full-res (max 1200×1200) — good quality, much smaller than raw phone photo
                    const fullBlob  = await withTimeout(resizeImage(file, 1200, 1200, 0.85), 15000, 'resize full');
                    const thumbBlob = await withTimeout(resizeImage(file, 400,  400,  0.80), 15000, 'resize thumb');

                    // Upload full-res
                    const fullRef  = storageRef.child(`museum_artifacts/${artifactId}/${timestamp}_${baseName}.jpg`);
                    await withTimeout(fullRef.put(fullBlob, { contentType: 'image/jpeg' }), 30000, 'upload full');
                    const fullUrl  = await withTimeout(fullRef.getDownloadURL(), 10000, 'get full URL');

                    // Upload thumbnail into a thumbs/ subfolder
                    const thumbRef = storageRef.child(`museum_artifacts/${artifactId}/thumbs/${timestamp}_${baseName}_thumb.jpg`);
                    await withTimeout(thumbRef.put(thumbBlob, { contentType: 'image/jpeg' }), 30000, 'upload thumb');
                    const thumbUrl = await withTimeout(thumbRef.getDownloadURL(), 10000, 'get thumb URL');

                    setUploadingPhoto(false);
                    return { fullUrl, thumbUrl };
                } catch (error) {
                    console.error('Photo upload error:', error);
                    setUploadingPhoto(false);
                    alert('Error uploading photo');
                    return null;
                }
            };

            // ── Reprocess existing photos ────────────────────────────────
            // Fetches each existing photo URL, converts to a blob, generates a
            // thumbnail via canvas, uploads it, and saves the thumbUrl to Firestore.
            const [reprocessing, setReprocessing] = useState(false);
            const [reprocessProgress, setReprocessProgress] = useState(null);
            const reprocessPausedRef = React.useRef(false);

            const REPROCESS_KEY = 'wwiitunnels_thumb_progress';

            // Wraps any promise with a timeout — rejects after ms milliseconds
            const withTimeout = (promise, ms, label) => {
                const timer = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error(`Timeout after ${ms/1000}s: ${label}`)), ms)
                );
                return Promise.race([promise, timer]);
            };

            const reprocessExistingPhotos = async (retryFailedOnly = false) => {
                const saved = (() => { try { return JSON.parse(localStorage.getItem(REPROCESS_KEY)); } catch(e) { return null; } })();
                const hasProgress = saved && saved.completedIds?.length > 0;

                // Count how many artifacts actually have null/missing thumbnails
                const artifactsWithFailed = artifacts.filter(a =>
                    a.photos?.length > 0 &&
                    a.photos.some((_, i) => !a.thumbnails?.[i])
                );

                if (retryFailedOnly) {
                    if (artifactsWithFailed.length === 0) {
                        alert('✅ No failed thumbnails found — all photos have thumbnails!');
                        return;
                    }
                    if (!confirm(`Retry ${artifactsWithFailed.length} artifact${artifactsWithFailed.length > 1 ? 's' : ''} with missing thumbnails?\n\nThis will only process photos that failed or were skipped previously.`)) return;
                } else if (hasProgress) {
                    const choice = confirm(`Resume from where you left off?\n\n${saved.completedIds.length} artifacts already processed.\n\nClick OK to resume, Cancel to start fresh.`);
                    if (choice === false) {
                        // Start fresh — but ask if they want retry-failed instead
                        localStorage.removeItem(REPROCESS_KEY);
                        if (artifactsWithFailed.length > 0) {
                            const doRetry = confirm(`${artifactsWithFailed.length} artifact${artifactsWithFailed.length > 1 ? 's' : ''} have missing thumbnails.\n\nClick OK to retry only those, Cancel to regenerate everything from scratch.`);
                            if (doRetry) {
                                return reprocessExistingPhotos(true);
                            }
                        }
                    }
                } else {
                    if (!confirm('Generate thumbnails for all existing photos.\n\nProgress is saved automatically — you can pause and resume at any time.\n\nContinue?')) return;
                }

                reprocessPausedRef.current = false;
                setReprocessing(true);

                // ── Fetch FRESH data from Firestore ──────────────────────
                // Don't trust React state — it may be stale from page load.
                // Pull the current thumbnails[] directly from Firestore so we
                // know exactly which slots are genuinely missing.
                let freshArtifacts = [];
                try {
                    const snapshot = await db.collection('museum_artifacts').get();
                    snapshot.forEach(doc => freshArtifacts.push({ id: doc.id, ...doc.data() }));
                    console.log(`📦 Fresh data loaded: ${freshArtifacts.length} artifacts`);
                } catch(e) {
                    alert('Could not load fresh data from Firebase. Check your connection and try again.');
                    setReprocessing(false);
                    return;
                }

                // Decide which artifacts to process based on mode
                let toProcess;
                if (retryFailedOnly) {
                    toProcess = freshArtifacts.filter(a =>
                        a.photos?.length > 0 &&
                        a.photos.some((_, i) => !a.thumbnails?.[i])
                    );
                    console.log(`🔁 Retry mode: ${toProcess.length} artifacts with missing thumbnails`);
                    toProcess.forEach(a => {
                        const missing = a.photos.filter((_,i) => !a.thumbnails?.[i]).length;
                        console.log(`  - #${a.itemNumber} ${a.name}: ${missing}/${a.photos.length} photos missing thumbs`);
                    });
                    if (toProcess.length === 0) {
                        setReprocessing(false);
                        alert('✅ Fresh check complete — all photos already have thumbnails in Firebase!');
                        return;
                    }
                } else {
                    const allWithPhotos = freshArtifacts.filter(a => a.photos?.length > 0);
                    const completedSet  = new Set(hasProgress && saved ? saved.completedIds : []);
                    toProcess = allWithPhotos.filter(a => !completedSet.has(a.id));
                }

                const completedIds = new Set(
                    (!retryFailedOnly && hasProgress && saved) ? saved.completedIds : []
                );

                let done    = retryFailedOnly ? 0 : completedIds.size;
                let total   = retryFailedOnly ? toProcess.length : freshArtifacts.filter(a => a.photos?.length > 0).length;
                let fixed   = 0;
                let failed  = 0;

                setReprocessProgress({ done, total, fixed, failed, paused: false, retryMode: retryFailedOnly });

                for (const artifact of toProcess) {
                    if (reprocessPausedRef.current) {
                        setReprocessProgress(p => ({ ...p, paused: true }));
                        setReprocessing(false);
                        return;
                    }

                    // Use fresh data for this artifact (not stale React state)
                    const freshArtifact = freshArtifacts.find(a => a.id === artifact.id) || artifact;

                    // Build new thumbnails array — keep existing good ones, retry null slots
                    const newThumbs = [...(freshArtifact.thumbnails || [])];
                    // Ensure array is same length as photos
                    while (newThumbs.length < freshArtifact.photos.length) newThumbs.push(null);

                    let artifactChanged = false;

                    for (let idx = 0; idx < freshArtifact.photos.length; idx++) {
                        // Skip if this slot already has a valid thumbnail
                        if (newThumbs[idx]) continue;

                        const photoUrl = freshArtifact.photos[idx];
                        let response = null, blob = null, file = null, thumbBlob = null;
                        try {
                            response  = await withTimeout(fetch(photoUrl), 20000, 'fetch photo');
                            blob      = await withTimeout(response.blob(), 10000, 'read blob');
                            file      = new File([blob], 'photo.jpg', { type: blob.type });
                            blob      = null;

                            thumbBlob = await withTimeout(resizeImage(file, 400, 400, 0.80), 15000, 'resize');
                            file      = null;

                            const thumbRef = storage.ref().child(
                                `museum_artifacts/${artifact.id}/thumbs/rp_${Date.now()}_${idx}.jpg`
                            );
                            await withTimeout(thumbRef.put(thumbBlob, { contentType: 'image/jpeg' }), 30000, 'upload');
                            thumbBlob = null;

                            const thumbUrl = await withTimeout(thumbRef.getDownloadURL(), 10000, 'get URL');
                            newThumbs[idx] = thumbUrl;
                            artifactChanged = true;
                            fixed++;
                        } catch (err) {
                            const isTimeout = err.message?.startsWith('Timeout');
                            console.error(`${isTimeout ? '⏱ TIMEOUT' : '✗ FAILED'}: ${artifact.name} photo ${idx} —`, err.message);
                            failed++;
                        } finally {
                            response = null; blob = null; file = null; thumbBlob = null;
                        }
                    }

                    // Only write to Firestore if something actually changed
                    if (artifactChanged) {
                        await db.collection('museum_artifacts').doc(artifact.id).update({
                            thumbnails: newThumbs,
                            updatedAt:  firebase.firestore.FieldValue.serverTimestamp(),
                            lastChange: 'Thumbnails generated'
                        });
                    }

                    done++;
                    completedIds.add(artifact.id);

                    // Save progress (only in full mode, not retry mode)
                    if (!retryFailedOnly) {
                        try {
                            localStorage.setItem(REPROCESS_KEY, JSON.stringify({
                                completedIds: [...completedIds],
                                savedAt: new Date().toISOString()
                            }));
                        } catch(e) {}
                    }

                    setReprocessProgress({ done, total, fixed, failed, paused: false, retryMode: retryFailedOnly });
                    await new Promise(r => setTimeout(r, 500));
                }

                localStorage.removeItem(REPROCESS_KEY);
                setReprocessing(false);
                setReprocessProgress(null);

                if (retryFailedOnly) {
                    alert(`✅ Retry complete!\n\n${fixed} thumbnails fixed${failed > 0 ? `\n⚠️ ${failed} still failing — these photos may be corrupted or too large` : '\n\nAll previously failed thumbnails are now working!'}`);
                } else {
                    alert(`✅ All done!\n\n${done} artifacts processed\n${fixed} thumbnails generated${failed > 0 ? `\n⚠️ ${failed} failed — click "Retry Failed" to try again` : ''}`);
                }
            };

            const pauseReprocess = () => {
                reprocessPausedRef.current = true;
            };

            // ── Maintenance helpers ──────────────────────────────────────
            const calcNextDue = (lastDone, frequency, customDays) => {
                if (!lastDone || frequency === 'One-time') return null;
                const d = new Date(lastDone);
                const days = frequency === 'Weekly' ? 7
                    : frequency === 'Monthly' ? 30
                    : frequency === 'Yearly' ? 365
                    : parseInt(customDays) || 0;
                if (!days) return null;
                d.setDate(d.getDate() + days);
                return d.toISOString().split('T')[0];
            };

            const maintStatus = (nextDue) => {
                if (!nextDue) return 'none';
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(nextDue);
                const diffDays = Math.round((due - today) / 86400000);
                if (diffDays < 0) return 'overdue';
                if (diffDays <= 14) return 'soon';
                return 'ok';
            };

            const maintStatusLabel = (status, nextDue) => {
                if (status === 'none') return { icon: '⚪', label: 'No schedule set', cls: 'maint-status-none' };
                if (status === 'overdue') return { icon: '🔴', label: `Overdue (was due ${nextDue})`, cls: 'maint-status-overdue' };
                if (status === 'soon') return { icon: '🟡', label: `Due soon (${nextDue})`, cls: 'maint-status-soon' };
                return { icon: '🟢', label: `Up to date (next: ${nextDue})`, cls: 'maint-status-ok' };
            };

            const overdueItems = artifacts.filter(a => {
                const m = a.maintenance;
                if (!m || !m.nextDue) return false;
                return maintStatus(m.nextDue) === 'overdue';
            });

            const dueSoonItems = artifacts.filter(a => {
                const m = a.maintenance;
                if (!m || !m.nextDue) return false;
                return maintStatus(m.nextDue) === 'soon';
            });

            const ArtifactCard = ({ artifact }) => {
                const isSelected = selectedItems.includes(artifact.id);
                
                return (
                    <div 
                        className="artifact-card" 
                        onClick={() => {
                            if (bulkMode) {

                        }}
                        style={{

                        }}
                    >
                        {bulkMode && (
                            <div style={{
                                position: 'absolute',

                                right: '10px',

                                width: '30px',
                                height: '30px',

                                justifyContent: 'center',

                            }}>

                            </div>
                        )}
                        <div className="artifact-image">

                                    src={artifact.thumbnails?.[0] || artifact.photos[0]} 
                                    alt={artifact.name}
                                    loading="lazy"
                                />
                            ) : (
                                '🏛️'
                            )}
                        </div>
                        <div className="artifact-info">
                            <div className="artifact-number">Item #{artifact.itemNumber}</div>
                            <div className="artifact-name">{artifact.name}</div>
                            <div className="artifact-meta">
                                <div className="artifact-location">📍 {artifact.location}</div>
                            </div>
                        </div>
                    </div>
                );
            };

            const ListView = () => (
                <div className="list-view">
                    {filteredArtifacts.map(artifact => (
                        <div key={artifact.id} className="list-item" onClick={() => setSelectedArtifact(artifact)}>
                            <div>
                                <div className="artifact-number" style={{marginBottom: '5px'}}>
                                    Item #{artifact.itemNumber}
                                </div>
                                <div className="artifact-name">{artifact.name}</div>
                                <div className="artifact-meta">
                                    <span className="artifact-location">{artifact.location}</span>
                                    {artifact.description && (
                                        <span style={{color: 'rgba(255,255,255,0.5)', marginLeft: '10px'}}>
                                            {artifact.description.substring(0, 50)}...
                                        </span>
                                    )}
                                </div>
                            </div>
                            <div>→</div>
                        </div>
                    ))}
                </div>
            );

            const DetailModal = ({ artifact, onClose }) => {
                if (!artifact) return null;

                const fileInputRef = useRef(null);
                const [currentPhotoIndex, setCurrentPhotoIndex] = useState(0);
                const [activeTab, setActiveTab] = useState('details');
                const [showLogWork, setShowLogWork] = useState(false);
                const [showSetSchedule, setShowSetSchedule] = useState(false);
                const [savingMaint, setSavingMaint] = useState(false);

                // Log work form state
                const [logDate, setLogDate] = useState(new Date().toISOString().split('T')[0]);
                const [logTech, setLogTech] = useState('');
                const [logNotes, setLogNotes] = useState('');

                // Schedule form state
                const [schedType, setSchedType] = useState(artifact.maintenance?.type || 'Cleaning');
                const [schedFreq, setSchedFreq] = useState(artifact.maintenance?.frequency || 'Monthly');
                const [schedCustomDays, setSchedCustomDays] = useState(artifact.maintenance?.customDays || '');
                const [schedMethod, setSchedMethod] = useState(artifact.maintenance?.method || '');
                const [schedNotes, setSchedNotes] = useState(artifact.maintenance?.scheduleNotes || '');
                const [schedAssigned, setSchedAssigned] = useState(artifact.maintenance?.assignedTo || '');

                useEffect(() => { setCurrentPhotoIndex(0); }, [artifact.id]);

                const handlePhotoUpload = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (artifact.photos && artifact.photos.length >= 5) {
                        alert('Maximum 5 photos per item. Please delete a photo first.');
                        return;
                    }
                    const result = await uploadPhoto(file, artifact.id);
                    if (result) {
                        const { fullUrl, thumbUrl } = result;
                        const newPhotos  = artifact.photos     ? [...artifact.photos,     fullUrl]  : [fullUrl];
                        const newThumbs  = artifact.thumbnails ? [...artifact.thumbnails, thumbUrl] : [thumbUrl];
                        const changeText = artifact.photos?.length > 0 ? `Added photo (${newPhotos.length} total)` : 'Added first photo';
                        await db.collection('museum_artifacts').doc(artifact.id).update({
                            photos:     newPhotos,
                            thumbnails: newThumbs,
                            updatedAt:  firebase.firestore.FieldValue.serverTimestamp(),
                            lastChange: changeText
                        });
                        setCurrentPhotoIndex(newPhotos.length - 1);
                    }
                };

                const handleSaveSchedule = async () => {
                    setSavingMaint(true);
                    const nextDue = calcNextDue(
                        artifact.maintenance?.lastDone || null,
                        schedFreq,
                        schedCustomDays
                    );
                    await db.collection('museum_artifacts').doc(artifact.id).update({
                        maintenance: {
                            ...(artifact.maintenance || {}),
                            type: schedType,
                            frequency: schedFreq,
                            customDays: schedFreq === 'Custom' ? schedCustomDays : '',
                            method: schedMethod,
                            scheduleNotes: schedNotes,
                            assignedTo: schedAssigned,
                            nextDue: nextDue,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        },
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastChange: 'Maintenance schedule updated'
                    });
                    setSavingMaint(false);
                    setShowSetSchedule(false);
                };

                const handleLogWork = async () => {
                    if (!logDate) { alert('Please enter a date'); return; }
                    setSavingMaint(true);
                    const prevHistory = artifact.maintenance?.history || [];
                    const newEntry = { date: logDate, technician: logTech, notes: logNotes, id: Date.now().toString() };
                    const newHistory = [newEntry, ...prevHistory];

                    // Recalculate next due from this log date
                    const nextDue = calcNextDue(logDate, artifact.maintenance?.frequency || '', artifact.maintenance?.customDays || '');

                    await db.collection('museum_artifacts').doc(artifact.id).update({
                        maintenance: {
                            ...(artifact.maintenance || {}),
                            lastDone: logDate,
                            nextDue: nextDue,
                            history: newHistory
                        },
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastChange: `Maintenance logged: ${schedType || 'Work'} on ${logDate}`
                    });

                    setLogDate(new Date().toISOString().split('T')[0]);
                    setLogTech('');
                    setLogNotes('');
                    setSavingMaint(false);
                    setShowLogWork(false);
                };

                const m = artifact.maintenance || {};
                const status = maintStatus(m.nextDue);
                const { icon, label, cls } = maintStatusLabel(status, m.nextDue);
                const history = m.history || [];

                return (
                    <div className="modal" onClick={onClose}>

                                <button className={`detail-tab ${activeTab === 'maintenance' ? 'active' : ''}`} onClick={() => setActiveTab('maintenance')}>

                                </button>
                                <button className={`detail-tab ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
                                    📜 History {history.length > 0 ? `(${history.length})` : ''}
                                </button>
                            </div>

                            {/* ── DETAILS TAB ── */}
                            {activeTab === 'details' && (<>
                                <div className="photo-section">
                                    <div className="detail-label">

                                                {artifact.photos.length > 1 && (<>
                                                    <button style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',background:'rgba(0,0,0,0.7)',color:'white',border:'none',borderRadius:'50%',width:'40px',height:'40px',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}

                                                    <button style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',background:'rgba(0,0,0,0.7)',color:'white',border:'none',borderRadius:'50%',width:'40px',height:'40px',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}

                                            ))}
                                        </div>

                                    <div style={{display:'flex',gap:'10px',marginTop:'10px'}}>

                                                        const idx = currentPhotoIndex;
                                                        const newPhotos = artifact.photos.filter((_,i) => i !== idx);
                                                        const newThumbs = (artifact.thumbnails || []).filter((_,i) => i !== idx);
                                                        try {
                                                            // Delete full-res from storage
                                                            const photoRef = storage.refFromURL(artifact.photos[idx]);
                                                            await photoRef.delete();
                                                            // Delete thumbnail from storage if it exists
                                                            if (artifact.thumbnails?.[idx]) {
                                                                try {
                                                                    const thumbRef = storage.refFromURL(artifact.thumbnails[idx]);
                                                                    await thumbRef.delete();
                                                                } catch(e) { /* thumb may not exist, ignore */ }
                                                            }

                                                            console.error('Storage delete error:', error);
                                                        }
                                                        // Always update Firestore even if storage delete failed
                                                        await db.collection('museum_artifacts').doc(artifact.id).update({
                                                            photos: newPhotos,
                                                            thumbnails: newThumbs,
                                                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                                                            lastChange: `Deleted photo (${newPhotos.length} remaining)`
                                                        });

                                                    }
                                                }}>🗑️ Delete Photo</button>

                                </div>

                                <div className="detail-section">
                                    <div className="detail-label">Item Number</div>
                                    <div className="detail-value">#{artifact.itemNumber}</div>

                                <div className="detail-section">
                                    <div className="detail-label">Location</div>
                                    <div className="detail-value">{artifact.location}</div>

                                    </p>
                                    <button className="btn" style={{width:'100%'}} onClick={() => setShowLogWork(true)}>
                                        + Log Work Done
                                    </button>
                                </div>

                                {/* Recent history preview */}

                                        <div className="maintenance-section-title">🕐 Recent Work ({history.length} entries)</div>

                                            <div key={entry.id || entry.date} className="maint-history-entry">
                                                <div className="maint-history-date">{entry.date}</div>
                                                {entry.technician && <div className="maint-history-tech">👤 {entry.technician}</div>}
                                                {entry.notes && <div className="maint-history-notes">{entry.notes}</div>}
                                            </div>
                                        ))}

                                            <button className="btn btn-secondary" style={{width:'100%',marginTop:'8px',fontSize:'13px'}} onClick={() => setActiveTab('history')}>
                                                View all {history.length} entries →
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Log Work Modal */}
                                {showLogWork && (
                                    <div className="log-work-modal" onClick={() => setShowLogWork(false)}>
                                        <div className="log-work-content" onClick={e => e.stopPropagation()}>
                                            <div className="modal-header" style={{marginBottom:'20px'}}>
                                                <h3 style={{color:'#fff',fontSize:'18px'}}>Log Work Done</h3>
                                                <button className="close-btn" onClick={() => setShowLogWork(false)}>×</button>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Date Work Done *</label>
                                                <input type="date" className="form-input" value={logDate} onChange={e => setLogDate(e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Technician / Staff Name</label>
                                                <input type="text" className="form-input" placeholder="e.g. John Smith" value={logTech} onChange={e => setLogTech(e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Work Notes</label>
                                                <textarea className="form-textarea" placeholder="Describe what was done..." value={logNotes} onChange={e => setLogNotes(e.target.value)} style={{minHeight:'80px'}} />
                                            </div>
                                            <div style={{display:'flex',gap:'10px'}}>
                                                <button className="btn" style={{flex:1}} onClick={handleLogWork} disabled={savingMaint}>
                                                    {savingMaint ? 'Saving...' : '✓ Save Log Entry'}
                                                </button>
                                                <button className="btn btn-secondary" style={{flex:1}} onClick={() => setShowLogWork(false)}>Cancel</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Set Schedule Modal */}
                                {showSetSchedule && (
                                    <div className="log-work-modal" onClick={() => setShowSetSchedule(false)}>
                                        <div className="log-work-content" onClick={e => e.stopPropagation()} style={{maxWidth:'520px',maxHeight:'90vh',overflowY:'auto'}}>
                                            <div className="modal-header" style={{marginBottom:'20px'}}>
                                                <h3 style={{color:'#fff',fontSize:'18px'}}>Set Maintenance Schedule</h3>
                                                <button className="close-btn" onClick={() => setShowSetSchedule(false)}>×</button>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Maintenance Type</label>
                                                <select className="form-select" value={schedType} onChange={e => setSchedType(e.target.value)}>
                                                    <option>Cleaning</option>
                                                    <option>Restoration</option>
                                                    <option>Condition Check</option>
                                                    <option>Repair</option>
                                                    <option>Other</option>
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Frequency</label>
                                                <select className="form-select" value={schedFreq} onChange={e => setSchedFreq(e.target.value)}>
                                                    <option>One-time</option>
                                                    <option>Weekly</option>
                                                    <option>Monthly</option>
                                                    <option>Yearly</option>
                                                    <option>Custom</option>
                                                </select>
                                            </div>
                                            {schedFreq === 'Custom' && (
                                                <div className="form-group">
                                                    <label className="form-label">Every how many days?</label>
                                                    <input type="number" className="form-input" min="1" placeholder="e.g. 90" value={schedCustomDays} onChange={e => setSchedCustomDays(e.target.value)} />
                                                </div>
                                            )}
                                            <div className="form-group">
                                                <label className="form-label">Method / How to do it</label>
                                                <input type="text" className="form-input" placeholder="e.g. Gentle cloth wipe, no solvents" value={schedMethod} onChange={e => setSchedMethod(e.target.value)} />
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Notes / Precautions</label>
                                                <textarea className="form-textarea" placeholder="Any special instructions..." value={schedNotes} onChange={e => setSchedNotes(e.target.value)} style={{minHeight:'70px'}} />
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Assigned To (optional)</label>
                                                <input type="text" className="form-input" placeholder="e.g. Conservation team" value={schedAssigned} onChange={e => setSchedAssigned(e.target.value)} />
                                            </div>
                                            <div style={{display:'flex',gap:'10px'}}>
                                                <button className="btn" style={{flex:1}} onClick={handleSaveSchedule} disabled={savingMaint}>
                                                    {savingMaint ? 'Saving...' : '✓ Save Schedule'}
                                                </button>
                                                <button className="btn btn-secondary" style={{flex:1}} onClick={() => setShowSetSchedule(false)}>Cancel</button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </>)}

                            {/* ── HISTORY TAB ── */}
                            {activeTab === 'history' && (<>
                                <div className="maintenance-section">
                                    <div className="maintenance-section-title">📜 Full Maintenance History</div>
                                    {history.length === 0 ? (
                                        <div className="no-maintenance-msg">
                                            <div className="no-maint-icon">📋</div>
                                            <div>No work logged yet</div>
                                            <div style={{fontSize:'12px',marginTop:'5px'}}>Switch to the Maintenance tab to log completed work</div>
                                        </div>
                                    ) : (
                                        history.map(entry => (
                                            <div key={entry.id || entry.date} className="maint-history-entry">
                                                <div className="maint-history-date">{entry.date}</div>
                                                {entry.technician && <div className="maint-history-tech">👤 {entry.technician}</div>}
                                                <div className="maint-history-notes">{entry.notes || 'No notes recorded'}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div style={{display:'flex',gap:'10px',marginTop:'10px'}}>
                                    <button className="btn" onClick={() => setActiveTab('maintenance')}>+ Log New Work</button>
                                    <button className="btn btn-secondary" onClick={onClose}>Close</button>
                                </div>
                            </>)}
                        </div>
                    </div>
                );
            };

            const AddEditModal = ({ artifact, onClose }) => {
                const [formData, setFormData] = useState(artifact || {
                    itemNumber: '',
                    name: '',
                    site: selectedSite,
                    location: '',
                    description: '',
                    donor: '',
                    condition: 'Good',
                    conditionNotes: '',
                    lastServiced: '',
                    servicingDetails: ''
                });

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    try {
                        if (artifact) {
                            // Track changes
                            const changes = [];
                            
                            if (formData.name !== artifact.name) {
                                changes.push(`Changed name from "${artifact.name}" to "${formData.name}"`);
                            }
                            if (formData.location !== artifact.location) {
                                changes.push(`Moved from "${artifact.location || 'none'}" to "${formData.location}"`);
                            }
                            if (formData.description !== artifact.description) {
                                changes.push('Updated description');
                            }
                            if (formData.donor !== artifact.donor) {
                                changes.push('Updated donor');
                            }
                            if (formData.condition !== artifact.condition) {
                                changes.push(`Changed condition from "${artifact.condition}" to "${formData.condition}"`);
                            }
                            if (formData.itemNumber !== artifact.itemNumber) {
                                changes.push(`Changed item # from ${artifact.itemNumber} to ${formData.itemNumber}`);
                            }
                            if (formData.site !== artifact.site) {
                                changes.push(`Moved from ${artifact.site} to ${formData.site}`);
                            }
                            
                            // Update existing with change log
                            await db.collection('museum_artifacts').doc(artifact.id).update({
                                ...formData,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                                lastChange: changes.join(', ') || 'Details updated'
                            });
                        } else {
                            // Add new
                            await db.collection('museum_artifacts').add({
                                ...formData,
                                itemNumber: parseInt(formData.itemNumber) || null,
                                photos: [],
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                lastChange: 'Item created'
                            });

                        onClose();

                                <button className="close-btn" onClick={onClose}>×</button>

                                    <label className="form-label">Item Number</label>
                                    <input 
                                        type="number" 
                                        className="form-input"
                                        value={formData.itemNumber}
                                        onChange={e => setFormData({...formData, itemNumber: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Site *</label>
                                    <select 
                                        className="form-input"
                                        required
                                        value={formData.site}
                                        onChange={e => setFormData({...formData, site: e.target.value})}
                                    >
                                        {sites.map(site => (
                                            <option key={site} value={site}>{site}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Artifact Name *</label>
                                    <input 
                                        type="text" 
                                        className="form-input" 
                                        required
                                        value={formData.name}
                                        onChange={e => setFormData({...formData, name: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Location *</label>
                                    <input 
                                        type="text" 
                                        className="form-input"
                                        required
                                        placeholder="e.g., Spitfire Hall"
                                        value={formData.location}
                                        onChange={e => setFormData({...formData, location: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Description</label>
                                    <textarea 
                                        className="form-textarea"
                                        value={formData.description}
                                        onChange={e => setFormData({...formData, description: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Donor / Source</label>
                                    <input 
                                        type="text" 
                                        className="form-input"
                                        value={formData.donor}
                                        onChange={e => setFormData({...formData, donor: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Condition</label>
                                    <select 
                                        className="form-select"
                                        value={formData.condition}
                                        onChange={e => setFormData({...formData, condition: e.target.value})}
                                    >
                                        <option value="Excellent">Excellent</option>
                                        <option value="Good">Good</option>
                                        <option value="Fair">Fair</option>
                                        <option value="Poor">Poor</option>
                                    </select>
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Condition Notes</label>
                                    <textarea 
                                        className="form-textarea"
                                        value={formData.conditionNotes}
                                        onChange={e => setFormData({...formData, conditionNotes: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Last Serviced</label>
                                    <input 
                                        type="date" 
                                        className="form-input"
                                        value={formData.lastServiced}
                                        onChange={e => setFormData({...formData, lastServiced: e.target.value})}
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Servicing Details</label>
                                    <textarea 
                                        className="form-textarea"
                                        value={formData.servicingDetails}
                                        onChange={e => setFormData({...formData, servicingDetails: e.target.value})}
                                    />
                                </div>

                                <div className="controls">
                                    <button type="submit" className="btn">
                                        {artifact ? 'Update' : 'Add'} Artifact
                                    </button>
                                    <button type="button" className="btn btn-secondary" onClick={onClose}>
                                        Cancel

                                                onMouseLeave={e => e.currentTarget.style.background='rgba(255,193,7,0.08)'}>
                                                <div style={{fontWeight:'600',fontSize:'14px'}}>#{a.itemNumber} {a.name}</div>
                                                <div style={{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginTop:'3px'}}>{a.site} · {a.location} · Due: {a.maintenance?.nextDue}</div>
                                                <div style={{fontSize:'12px',color:'rgba(255,255,255,0.5)'}}>{a.maintenance?.type} · {a.maintenance?.frequency}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {overdueItems.length === 0 && dueSoonItems.length === 0 && (
                                    <div style={{textAlign:'center',padding:'40px 20px',color:'rgba(255,255,255,0.4)'}}>
                                        <div style={{fontSize:'48px',marginBottom:'12px'}}>✅</div>
                                        <div>All maintenance is up to date!</div>
                                    </div>
                                )}

                                <button className="btn btn-secondary" style={{width:'100%',marginTop:'10px'}} onClick={() => setShowMaintenanceDashboard(false)}>Close</button>
                            </div>
                        </div>
                    )}

                    {/* Compact Numbers Modal */}
                    {showCompactModal && (
                        <div className="modal" onClick={() => setShowCompactModal(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth: '500px'}}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Compact Item Numbers</h2>
                                    <button className="close-btn" onClick={() => setShowCompactModal(false)}>×</button>
                                </div>
                                <div style={{padding: '20px'}}>
                                    <p style={{marginBottom: '15px'}}>
                                        <strong>Compact Numbers</strong> removes gaps in the item number sequence by renumbering all items sequentially (1, 2, 3…).
                                    </p>
                                    <p style={{marginBottom: '10px', color: 'rgba(255,255,255,0.6)', fontSize:'13px'}}>
                                        Example: If you have items #1, #2, #5, #9 — after compacting they become #1, #2, #3, #4. Use this after deleting items to tidy up the numbering.
                                    </p>
                                    <p style={{marginBottom: '20px', color: '#e63946'}}>
                                        <strong>Warning:</strong> This will change item numbers for {artifacts.length} items. This action cannot be undone.
                                    </p>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <button className="btn" onClick={compactNumbers} style={{flex: 1}}>
                                            ✓ Compact Numbers
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => setShowCompactModal(false)} style={{flex: 1}}>
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
