            </label>
            <button onclick="checkAuth()"

    <div id="root" style="display:none;"></div>

    <script>
        const HASH = '092a52f290f37f0c24b6ad1ba4ec1bfb85f7937a62af13382ef373ac4ef9d252';
        const SESSION_KEY = 'wt_artifact_auth';

        async function sha256(msg) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        async function checkAuth() {
            const val = document.getElementById('pw-input').value;
            const hash = await sha256(val);
            if (hash === HASH) {
                if (document.getElementById('remember-me').checked) localStorage.setItem(SESSION_KEY, '1');
                sessionStorage.setItem(SESSION_KEY, '1');
                showApp();
            } else {
                document.getElementById('pw-error').textContent = 'Incorrect password. Try again.';
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        }

        function showApp() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('root').style.display = '';
        }

        function logout() {
            localStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(SESSION_KEY);
            document.getElementById('root').style.display = 'none';
            document.getElementById('auth-overlay').style.display = 'flex';
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-error').textContent = '';
        }

        if (localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY)) {
            showApp();
        } else {
            document.getElementById('auth-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('pw-input').focus(), 100);
        }
    </script>

        function App() {
            const [artifacts, setArtifacts] = useState([]);
            const [filteredArtifacts, setFilteredArtifacts] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedLocation, setSelectedLocation] = useState('All');
            const [viewMode, setViewMode] = useState('gallery');
            const [selectedArtifact, setSelectedArtifact] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showFloorPlan, setShowFloorPlan] = useState(false);
            const [loading, setLoading] = useState(true);
            const [importStatus, setImportStatus] = useState(null);
            const [uploadingPhoto, setUploadingPhoto] = useState(false);
            const [bulkMode, setBulkMode] = useState(false);
            const [selectedItems, setSelectedItems] = useState([]);
            const [showCompactModal, setShowCompactModal] = useState(false);
            const [showBulkActions, setShowBulkActions] = useState(false);

            // Get unique locations from artifacts
            const locations = ['All', ...new Set(
                artifacts
                    .map(a => a.location?.trim())
                    .filter(Boolean)
            )].sort();

            // Load artifacts from Firebase
            useEffect(() => {
                const unsubscribe = db.collection('museum_artifacts').onSnapshot(snapshot => {
                    const artifactsData = [];
                    snapshot.forEach(doc => {
                        artifactsData.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort by item number
                    artifactsData.sort((a, b) => (a.itemNumber || 0) - (b.itemNumber || 0));
                    setArtifacts(artifactsData);
                    setFilteredArtifacts(artifactsData);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            // Filter artifacts
            useEffect(() => {
                let filtered = artifacts;

                if (selectedLocation !== 'All') {
                    filtered = filtered.filter(a => a.location?.trim() === selectedLocation);
                }

                if (searchTerm) {
                    filtered = filtered.filter(a => 
                        a.name?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.location?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.description?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.donor?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        a.itemNumber?.toString().includes(searchTerm)
                    );
                }

                setFilteredArtifacts(filtered);
            }, [searchTerm, selectedLocation, artifacts]);

            // Import Excel data to Firebase
            const importExcelData = async () => {
                if (!window.confirm(`This will import ${ARTIFACTS_DATA.length} artifacts from the Excel file. Continue?`)) {
                    return;
                }

                try {
                    setLoading(true);
                    const batch = db.batch();
                    
                    ARTIFACTS_DATA.forEach(artifact => {
                        const docRef = db.collection('museum_artifacts').doc();
                        batch.set(docRef, {
                            ...artifact,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    await batch.commit();
                    setImportStatus({ success: true, count: ARTIFACTS_DATA.length });
                    setTimeout(() => setImportStatus(null), 5000);
                } catch (error) {
                    console.error('Import error:', error);
                    setImportStatus({ success: false, message: error.message });
                }
            };

            // Compact Numbers - Renumber items sequentially
            const compactNumbers = async () => {
                try {
                    setLoading(true);
                    const sortedArtifacts = [...artifacts].sort((a, b) => (a.itemNumber || 0) - (b.itemNumber || 0));
                    const batch = db.batch();
                    
                    sortedArtifacts.forEach((artifact, index) => {
                        const docRef = db.collection('museum_artifacts').doc(artifact.id);
                        batch.update(docRef, {
                            itemNumber: index + 1,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            lastChange: `Renumbered from #${artifact.itemNumber} to #${index + 1}`
                        });
                    });

                    await batch.commit();
                    alert(`Successfully renumbered ${sortedArtifacts.length} items!`);
                    setShowCompactModal(false);
                    setLoading(false);
                } catch (error) {
                    console.error('Compact error:', error);
                    alert('Error compacting numbers');
                    setLoading(false);
                }
            };

            // Export to Excel
            const exportToExcel = () => {
                const exportData = artifacts.map(a => ({
                    'Item Number': a.itemNumber,
                    'Name': a.name,
                    'Location': a.location,
                    'Description': a.description,
                    'Donor': a.donor,
                    'Condition': a.condition,
                    'Condition Notes': a.conditionNotes,
                    'Last Serviced': a.lastServiced,
                    'Servicing Details': a.servicingDetails,
                    'Photos': a.photos?.length || 0,
                    'Last Updated': a.updatedAt?.toDate?.().toLocaleDateString('en-GB') || 'N/A'
                }));

                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Artifacts");
                XLSX.writeFile(wb, `WWII_Artifacts_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            // Bulk Delete
            const bulkDelete = async () => {
                if (!confirm(`Delete ${selectedItems.length} items? This cannot be undone!`)) return;
                
                try {
                    setLoading(true);
                    const batch = db.batch();
                    
                    selectedItems.forEach(id => {
                        const docRef = db.collection('museum_artifacts').doc(id);
                        batch.delete(docRef);
                    });

                    await batch.commit();
                    alert(`Deleted ${selectedItems.length} items successfully!`);
                    setSelectedItems([]);
                    setBulkMode(false);
                    setShowBulkActions(false);
                    setLoading(false);
                } catch (error) {
                    console.error('Bulk delete error:', error);
                    alert('Error deleting items');
                    setLoading(false);
                }
            };

            // Bulk Move Location
            const bulkMoveLocation = async (newLocation) => {
                if (!newLocation) return;
                if (!confirm(`Move ${selectedItems.length} items to "${newLocation}"?`)) return;
                
                try {
                    setLoading(true);
                    const batch = db.batch();
                    
                    selectedItems.forEach(id => {
                        const docRef = db.collection('museum_artifacts').doc(id);
                        const artifact = artifacts.find(a => a.id === id);
                        batch.update(docRef, {
                            location: newLocation,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            lastChange: `Moved from "${artifact.location}" to "${newLocation}"`
                        });
                    });

                    await batch.commit();
                    alert(`Moved ${selectedItems.length} items to ${newLocation}!`);
                    setSelectedItems([]);
                    setBulkMode(false);
                    setShowBulkActions(false);

                            const changes = [];
                            
                            if (formData.name !== artifact.name) {
                                changes.push(`Changed name from "${artifact.name}" to "${formData.name}"`);
                            }
                            if (formData.location !== artifact.location) {
                                changes.push(`Moved from "${artifact.location || 'none'}" to "${formData.location}"`);

                            if (formData.description !== artifact.description) {
                                changes.push('Updated description');

                                                        }}
                                                        style={{
                                                            background: 'rgba(255,255,255,0.05)',
                                                            padding: '10px',
                                                            borderRadius: '6px',
                                                            cursor: 'pointer',
                                                            transition: 'all 0.2s ease'
                                                        }}
                                                    >
                                                        <div style={{fontSize: '13px', fontWeight: '600'}}>
                                                            #{artifact.itemNumber} {artifact.name}
                                                        </div>
                                                        {artifact.description && (
                                                            <div style={{
                                                                fontSize: '11px',
                                                                color: 'rgba(255,255,255,0.6)',
                                                                marginTop: '4px'
                                                            }}>
                                                                {artifact.description.substring(0, 50)}...
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (loading) {
                return (
                    <div className="app-container">
                        <div className="empty-state">
                            <div className="empty-icon">⏳</div>
                            <h2>Loading artifacts...</h2>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <div className="header">
                        <div className="header-content">
                            <div className="logo-section">
                                <div className="logo">WT</div>
                                <div>
                                    <h1>WWII Tunnels Artifact Catalog</h1>
                                    <div className="subtitle">Museum Collection Management</div>
                                </div>
                            </div>
                            <div className="controls">
                                <button className="btn" onClick={() => setShowAddModal(true)}>
                                    + Add Artifact
                                </button>
                                {artifacts.length === 0 && (
                                    <button className="btn btn-success" onClick={importExcelData}>
                                        📥 Import {ARTIFACTS_DATA.length} Items
                                    </button>
                                )}
                                <button 
                                    className="btn btn-secondary" 
                                    onClick={() => {
                                        setBulkMode(!bulkMode);
                                        setSelectedItems([]);
                                        setShowBulkActions(false);
                                    }}
                                    style={{background: bulkMode ? '#e63946' : undefined}}
                                >
                                    {bulkMode ? '✓ Bulk Mode ON' : '☑️ Bulk Select'}
                                </button>
                                <button className="btn btn-secondary" onClick={exportToExcel}>
                                    📊 Export Excel
                                </button>
                                <button className="btn btn-secondary" onClick={() => setShowCompactModal(true)}>
                                    🔢 Compact Numbers
                                </button>
                                <button className="btn btn-secondary" onClick={() => setShowFloorPlan(true)}>
                                    🗺️ Floor Plan
                                </button>
                            </div>
                        </div>
                    </div>

                    {importStatus && (
                        importStatus.success ? (
                            <div className="import-success">
                                <span>✓</span>
                                <span>Successfully imported {importStatus.count} artifacts!</span>
                            </div>
                        ) : (
                            <div className="import-error">
                                Error importing: {importStatus.message}
                            </div>
                        )
                    )}

                    <div className="stats-bar">
                        <div className="stat-item">
                            <div className="stat-label">Total Artifacts</div>
                            <div className="stat-value">{artifacts.length}</div>
                        </div>
                        <div className="stat-item">
                            <div className="stat-label">Locations</div>
                            <div className="stat-value">{locations.length - 1}</div>
                        </div>
                        <div className="stat-item">
                            <div className="stat-label">With Photos</div>
                            <div className="stat-value">
                                {artifacts.filter(a => a.photos?.length > 0).length}
                            </div>
                        </div>
                        <div className="stat-item">
                            <div className="stat-label">Showing</div>
                            <div className="stat-value">{filteredArtifacts.length}</div>
                        </div>
                    </div>

                    {/* Recently Edited Section */}
                    {artifacts.filter(a => a.updatedAt).length > 0 && (
                        <details 
                            open
                            style={{
                                background: 'rgba(230, 57, 70, 0.1)',
                                border: '1px solid rgba(230, 57, 70, 0.3)',
                                borderRadius: '15px',
                                padding: '20px',
                                marginBottom: '30px'
                            }}
                        >
                            <summary style={{
                                cursor: 'pointer',
                                fontWeight: 'bold',
                                fontSize: '18px',
                                color: '#e63946',
                                marginBottom: '15px',
                                listStyle: 'none',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px'
                            }}>
                                <span>📝 Recently Edited ({artifacts.filter(a => a.updatedAt).length})</span>
                            </summary>
                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                gap: '8px',
                                marginTop: '15px'
                            }}>
                                {artifacts
                                    .filter(a => a.updatedAt)
                                    .sort((a, b) => {
                                        const aTime = a.updatedAt?.toMillis?.() || 0;
                                        const bTime = b.updatedAt?.toMillis?.() || 0;
                                        return bTime - aTime;
                                    })
                                    .slice(0, 10)
                                    .map((artifact, index, arr) => {
                                        const updateTime = artifact.updatedAt?.toDate?.();
                                        const timeAgo = updateTime ? (() => {
                                            const diff = Date.now() - updateTime.getTime();
                                            const minutes = Math.floor(diff / 60000);
                                            const hours = Math.floor(diff / 3600000);
                                            const days = Math.floor(diff / 86400000);
                                            if (minutes < 1) return 'Just now';
                                            if (minutes < 60) return `${minutes}m ago`;
                                            if (hours < 24) return `${hours}h ago`;
                                            return `${days}d ago`;
                                        })() : 'Unknown';

                                        // Get the change description
                                        const changeText = artifact.lastChange || 'Details updated';

                                        return (
                                            <div 
                                                key={artifact.id}
                                                onClick={() => setSelectedArtifact(artifact)}
                                                style={{
                                                    background: 'rgba(255, 255, 255, 0.05)',
                                                    padding: '10px 15px',
                                                    borderRadius: '8px',
                                                    border: '1px solid rgba(255, 255, 255, 0.1)',
                                                    cursor: 'pointer',
                                                    transition: 'all 0.2s',
                                                    display: 'flex',
                                                    justifyContent: 'space-between',
                                                    alignItems: 'center'
                                                }}
                                                onMouseEnter={e => e.currentTarget.style.background = 'rgba(255, 255, 255, 0.1)'}
                                                onMouseLeave={e => e.currentTarget.style.background = 'rgba(255, 255, 255, 0.05)'}
                                            >
                                                <div style={{flex: 1}}>
                                                    <span style={{fontSize: '12px', color: 'rgba(255,255,255,0.5)', marginRight: '10px'}}>
                                                        #{artifact.itemNumber}
                                                    </span>
                                                    <span style={{fontWeight: '500'}}>
                                                        {artifact.name}
                                                    </span>
                                                    <span style={{fontSize: '13px', color: 'rgba(255,255,255,0.6)', marginLeft: '10px'}}>
                                                        — {changeText}
                                                    </span>
                                                </div>
                                                <div style={{fontSize: '12px', color: '#e63946', whiteSpace: 'nowrap', marginLeft: '15px'}}>
                                                    {timeAgo}
                                                </div>
                                            </div>
                                        );
                                    })
                                }
                            </div>
                        </details>
                    )}

                    <div className="search-bar">
                        <input 
                            type="text" 
                            className="search-input" 
                            placeholder="Search by name, item #, location, description, or donor..."
                            value={searchTerm}
                            onChange={e => setSearchTerm(e.target.value)}
                        />
                        <div className="filters">
                            {locations.slice(0, 15).map(loc => (
                                <button 
                                    key={loc}
                                    className={`filter-btn ${selectedLocation === loc ? 'active' : ''}`}
                                    onClick={() => setSelectedLocation(loc)}
                                >
                                    {loc} {loc !== 'All' && `(${artifacts.filter(a => a.location === loc).length})`}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="view-toggle">
                        <button 
                            className={`btn ${viewMode === 'gallery' ? '' : 'btn-secondary'}`}
                            onClick={() => setViewMode('gallery')}
                        >
                            📷 Gallery
                        </button>
                        <button 
                            className={`btn ${viewMode === 'list' ? '' : 'btn-secondary'}`}
                            onClick={() => setViewMode('list')}
                        >
                            📋 List
                        </button>
                    </div>

                    {filteredArtifacts.length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-icon">🏛️</div>
                            <h2>No artifacts found</h2>
                            <p>Try adjusting your search or filters</p>
                        </div>
                    ) : viewMode === 'gallery' ? (
                        <div className="gallery-grid">
                            {filteredArtifacts.map(artifact => (
                                <ArtifactCard key={artifact.id} artifact={artifact} />
                            ))}
                        </div>
                    ) : (
                        <ListView />
                    )}

                    {selectedArtifact && (
                        <DetailModal 
                            artifact={selectedArtifact} 
                            onClose={() => setSelectedArtifact(null)} 
                        />
                    )}

                    {showAddModal && (
                        <AddEditModal onClose={() => setShowAddModal(false)} />
                    )}

                    {showEditModal && (
                        <AddEditModal 
                            artifact={showEditModal}
                            onClose={() => setShowEditModal(false)} 
                        />
                    )}

                    {showFloorPlan && (
                        <FloorPlanModal onClose={() => setShowFloorPlan(false)} />
                    )}

                    {/* Bulk Actions Bar */}
                    {bulkMode && selectedItems.length > 0 && (
                        <div style={{
                            position: 'fixed',
                            bottom: '20px',
                            left: '50%',
                            transform: 'translateX(-50%)',
                            background: '#e63946',
                            padding: '15px 30px',
                            borderRadius: '50px',
                            display: 'flex',
                            gap: '15px',
                            alignItems: 'center',
                            boxShadow: '0 8px 32px rgba(0,0,0,0.5)',
                            zIndex: 1000
                        }}>
                            <span style={{fontWeight: 'bold'}}>{selectedItems.length} selected</span>
                            <button 
                                className="btn" 
                                style={{minWidth: 'auto', padding: '8px 20px'}}
                                onClick={() => {
                                    const newLoc = prompt('Move to location:');
                                    if (newLoc) bulkMoveLocation(newLoc);
                                }}
                            >
                                📍 Move
                            </button>
                            <button 
                                className="btn" 
                                style={{minWidth: 'auto', padding: '8px 20px', background: '#dc3545'}}
                                onClick={bulkDelete}
                            >
                                🗑️ Delete
                            </button>
                            <button 
                                className="btn btn-secondary" 
                                style={{minWidth: 'auto', padding: '8px 20px'}}
                                onClick={() => setSelectedItems([])}
                            >
                                Cancel
                            </button>
                        </div>
                    )}

                    {/* Compact Numbers Modal */}
                    {showCompactModal && (
                        <div className="modal" onClick={() => setShowCompactModal(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth: '500px'}}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Compact Item Numbers</h2>
                                    <button className="close-btn" onClick={() => setShowCompactModal(false)}>×</button>
                                </div>
                                <div style={{padding: '20px'}}>
                                    <p style={{marginBottom: '20px'}}>
                                        This will renumber all items sequentially (1, 2, 3...) removing any gaps.
                                    </p>
                                    <p style={{marginBottom: '20px', color: '#e63946'}}>
                                        <strong>Warning:</strong> This will change item numbers for {artifacts.length} items. This action cannot be undone.
                                    </p>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <button className="btn" onClick={compactNumbers} style={{flex: 1}}>
                                            ✓ Compact Numbers
                                        </button>
                                        <button className="btn btn-secondary" onClick={() => setShowCompactModal(false)} style={{flex: 1}}>
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
